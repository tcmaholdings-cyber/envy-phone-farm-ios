# Pinned so the Postgres volume (phone-farm_phone-farm-postgres) does not depend
# on the directory compose runs from: a release deploy runs it from
# releases/<id>/, which would otherwise start an empty database. Set
# COMPOSE_PROJECT_NAME in .env only if your original checkout directory was not
# named phone-farm (check with `docker volume ls | grep postgres`).
name: phone-farm
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phone_farm}
      POSTGRES_USER: ${POSTGRES_USER:-phone_farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - phone-farm-postgres:/var/lib/postgresql/data

volumes:
  phone-farm-postgres:
