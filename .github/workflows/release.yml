# On a version tag (v1.2.3): check, build the release tarball with
# scripts/release.sh and attach it, with its sha256, to a GitHub release.
# Deploying stays a separate, deliberate step on the host (docs/deploy.md);
# this workflow never reaches the farm. GitHub-hosted runner, no secrets
# beyond the job's own GITHUB_TOKEN (contents: write, to publish the release).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck and test
        run: npm run check

      - name: Build tarball
        id: build
        run: |
          tarball=$(scripts/release.sh --version "$GITHUB_REF_NAME" --out dist | tail -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          cat "$tarball.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: |
          notes=$(printf 'Deploy: `scripts/deploy-remote.sh --tarball %s <user@host>` (docs/deploy.md).\n\nsha256:\n```\n%s\n```\n' \
            "$(basename "$TARBALL")" "$(cat "$TARBALL.sha256")")
          # Re-running the workflow for the same tag replaces the assets instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TARBALL" "$TARBALL.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TARBALL" "$TARBALL.sha256" \
              --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes --verify-tag
          fi
