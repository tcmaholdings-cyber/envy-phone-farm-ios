<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks · __BRAND_TITLE__</title>
    <link rel="preload" href="/assets/fonts/oswald-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/poppins-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="page-tasks">
    <header class="topbar">
        <div class="topbar-inner">
            __BRAND__
            <nav class="topbar-nav" aria-label="Main"><a class="nav-link" href="/">Devices</a><a class="nav-link" href="/tasks" aria-current="page">Tasks</a><a class="nav-link" href="/devices/register">Register</a>__PLUGIN_NAV____AUTH_NAV__</nav>
        </div>
    </header>
    <main class="shell">
        <header class="page-header">
            <div><span class="eyebrow">Automation</span><h1>Tasks</h1><p>Upcoming schedules and run history across every device.</p></div>
            <div class="page-actions"><button id="refresh-tasks" class="button secondary" type="button">Refresh</button></div>
        </header>
        <div id="connection-banner" class="banner warn" role="alert" hidden><strong>Lost contact with the server. Retrying…</strong><p>The lists below show the last data received.</p></div>
        <div id="tasks-error" class="banner err" role="alert" hidden></div>
        <section class="panel task-section" aria-labelledby="schedules-title">
            <div class="section-heading"><div><span class="eyebrow">Queue</span><h2 id="schedules-title">Schedules</h2></div></div>
            <div id="schedules" class="task-list" aria-busy="true"><span class="visually-hidden">Loading schedules…</span><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
        </section>
        <section class="panel task-section" aria-labelledby="executions-title">
            <div class="section-heading"><div><span class="eyebrow">History</span><h2 id="executions-title">Runs</h2></div></div>
            <div id="executions" class="task-list" aria-busy="true"><span class="visually-hidden">Loading runs…</span><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
        </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/assets/tasks.js"></script>
    <footer class="app-footer">__FOOTER__</footer>
</body>
</html>
